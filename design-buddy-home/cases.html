      <!-- ============ 主内容区 ============ -->
      <main class="main cases-main">
        <!-- 顶部 Hero -->
        <section class="cases-hero">
          <div class="cases-hero-inner">
            <h1>商业级演示文稿案例</h1>
            <p>4 个完整案例，每个 15 页，覆盖科技发布会、商业计划书、市场分析报告、奢华品牌手册四种商业场景。每个案例都有完整的叙事逻辑、专业视觉设计与数据支撑。</p>
            <div class="cases-hero-stats">
              <div class="cases-hero-stat"><strong id="case-count">4</strong><span>个商业案例</span></div>
              <div class="cases-hero-stat"><strong id="case-total-pages">60</strong><span>页完整演示</span></div>
              <div class="cases-hero-stat"><strong>4</strong><span>种风格体系</span></div>
              <div class="cases-hero-stat"><strong>12+</strong><span>种版式布局</span></div>
            </div>
          </div>
        </section>

        <!-- 案例网格 -->
        <section class="cases-section">
          <div class="cases-section-head">
            <h2>全部案例</h2>
            <p>点击任意案例进入全屏浏览 · 支持逐页切换 / 自动播放 / 文档视图</p>
          </div>
          <div class="case-grid" id="case-grid"><!-- 由 cases.js 渲染 --></div>
        </section>

        <button class="help-fab" type="button" title="帮助">?</button>
