<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>媒体库 — Design Buddy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e2b4d'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/media.css" />
  </head>
  <body>
    <div class="app">
      <!-- ============ 最左侧窄图标栏 ============ -->
      <nav class="rail" aria-label="模块导航">
        <div class="rail-top">
          <a class="brand-logo" href="index.html" aria-label="Design Buddy">G</a>
          <a href="index.html" class="rail-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
            <span>首页</span>
          </a>
          <a href="media.html" class="rail-item rail-item-active" aria-current="page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>媒体</span>
          </a>
          <a href="templates.html" class="rail-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span>模板</span>
          </a>
          <a href="themes.html" class="rail-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20 2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 1 0-5h2a6 6 0 0 0 6-6 10 10 0 0 0-8-4z"/></svg>
            <span>主题</span>
          </a>
          <a href="settings.html" class="rail-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>设置</span>
          </a>
          <div class="more-wrap">
            <button class="rail-item" type="button" aria-haspopup="true" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
              <span>更多</span>
            </button>
            <div class="more-flyout" hidden role="menu" aria-label="更多功能">
              <button class="menu-row" type="button" role="menuitem" data-more="技能">
                <svg class="icon menu-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                <span class="menu-label">技能</span>
              </button>
              <button class="menu-row" type="button" role="menuitem" data-more="专家">
                <svg class="icon menu-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3.5"/><path d="M12 8V4.5M9.5 4.5h5"/><circle cx="9.6" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="14.4" cy="13" r="1.3" fill="currentColor" stroke="none"/><path d="M9.5 16.2h5"/></svg>
                <span class="menu-label">专家</span>
              </button>
              <button class="menu-row" type="button" role="menuitem" data-more="连接器">
                <svg class="icon menu-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <span class="menu-label">连接器</span>
              </button>
            </div>
          </div>
        </div>
        <div class="rail-footer">
          <button class="footer-icon" type="button" data-demo="邀请成员">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </button>
          <button class="footer-icon" type="button" data-demo="消息">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <span class="avatar avatar-green">RW</span>
        </div>
      </nav>

      <!-- ============ 媒体库侧栏 ============ -->
      <aside class="sidebar media-sidebar">
        <div class="sidebar-inner">
          <h2 class="side-title">媒体库</h2>
          <nav class="side-nav" aria-label="媒体库">
            <a href="media.html" class="nav-item nav-item-active" aria-current="page">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>媒体</span>
            </a>
            <a href="#" class="nav-item has-tooltip" data-demo="图形" data-tip="图形">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/></svg>
              <span>图形</span>
            </a>
          </nav>
        </div>
      </aside>

      <!-- ============ 主区域 ============ -->
      <main class="main media-main">
        <header class="media-head">
          <h1 class="media-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            媒体
          </h1>
          <p class="media-subtitle">在此处查找所有已上传或创建的媒体。</p>

          <div class="media-actions">
            <!-- 新建 AI 拆分按钮 -->
            <div class="split-wrap">
              <button class="split-btn" id="create-ai-btn" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="split-main">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  新建
                </span>
                <span class="ai-badge">AI</span>
                <span class="split-divider"></span>
                <svg class="icon tiny split-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="split-menu" id="create-ai-menu" hidden>
                <button type="button" data-demo="AI 生成图片">AI 生成图片</button>
                <button type="button" data-demo="AI 生成图形">AI 生成图形</button>
                <button type="button" data-demo="AI 智能修图">AI 智能修图</button>
              </div>
            </div>

            <button class="upload-btn" id="upload-btn" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              上传
            </button>
            <input type="file" id="upload-input" hidden accept="image/*" multiple />
          </div>
        </header>

        <!-- Plus 升级横幅 -->
        <section class="plus-banner">
          <div class="plus-text">
            <p class="plus-title">使用 Design Buddy 智能助手搜索您的媒体内容</p>
            <p class="plus-desc">升级到 Plus，在创作时查找并复用您保存的图片。</p>
          </div>
          <button class="plus-cta" type="button" data-demo="升级至 Plus">升级至 Plus</button>
        </section>

        <!-- 选项卡 -->
        <div class="media-tabs" role="tablist">
          <button class="media-tab is-active" type="button" role="tab" aria-selected="true" data-tab="all">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            所有媒体
          </button>
          <button class="media-tab" type="button" role="tab" data-tab="fav">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            收藏夹
          </button>
        </div>

        <!-- 筛选行 -->
        <div class="media-filters">
          <div class="filter-selects">
            <div class="m-select" data-filter="source">
              <button class="m-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="m-select-value">所有来源</span>
                <svg class="icon tiny" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="m-select-menu" hidden role="listbox">
                <button class="is-selected" type="button" role="option" data-value="all">所有来源</button>
                <button type="button" role="option" data-value="upload">本地上传</button>
                <button type="button" role="option" data-value="ai">AI 生成</button>
              </div>
            </div>
            <div class="m-select" data-filter="type">
              <button class="m-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="m-select-value">所有媒体类型</span>
                <svg class="icon tiny" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="m-select-menu" hidden role="listbox">
                <button class="is-selected" type="button" role="option" data-value="all">所有媒体类型</button>
                <button type="button" role="option" data-value="image">图片</button>
                <button type="button" role="option" data-value="graphic">图形</button>
              </div>
            </div>
            <div class="m-select" data-filter="gen">
              <button class="m-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="m-select-value">所有生成类型</span>
                <svg class="icon tiny" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="m-select-menu" hidden role="listbox">
                <button class="is-selected" type="button" role="option" data-value="all">所有生成类型</button>
                <button type="button" role="option" data-value="card">卡片设计</button>
                <button type="button" role="option" data-value="photo">摄影素材</button>
                <button type="button" role="option" data-value="illustration">插画</button>
              </div>
            </div>
          </div>

          <div class="filter-actions">
            <button class="icon-btn" id="sort-btn" type="button" aria-label="切换排序" title="最新 / 最旧">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
            </button>
            <button class="pick-btn" id="pick-btn" type="button" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8.5 12 11 14.5 15.5 9.5"/></svg>
              选择媒体
            </button>
          </div>
        </div>

        <!-- 媒体网格 -->
        <section class="media-section">
          <h2 class="month-label">2026年10月</h2>
          <div class="media-grid" id="media-grid"><!-- 由 media.js 渲染 --></div>
          <div class="media-empty" id="media-empty" hidden>
            <div class="media-empty-ic">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <p id="media-empty-text">当前筛选条件下没有媒体</p>
          </div>
        </section>

        <button class="help-fab" type="button" data-demo="帮助">?</button>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/media.js"></script>
  </body>
</html>
